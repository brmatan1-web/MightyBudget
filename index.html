<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081b33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MightyBudget">
  <title>MightyBudget</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=2.0">
</head>
<body data-page="home">
<div class="app">
  <header>
    <div class="htext"><small id="subtitle">התקציב המשפחתי</small><h1 id="title">שלום</h1></div>
    <div class="hbtns">
      <button class="hbtn" id="refreshBtn" aria-label="רענון">⟳</button>
      <button class="hbtn" id="bellBtn" aria-label="התראות">🔔<i id="badge" class="badge-dot" hidden></i></button>
      <button class="avatar" id="userBtn" aria-label="תפריט">מ</button>
    </div>
  </header>
  <div id="menu" class="menu" hidden></div>
  <div id="verbar" class="verbar" hidden></div>
  <div id="offline" class="offline" hidden>מוצגים נתונים שמורים. אין חיבור לשרת.</div>
  <main>
    <section class="page active" data-page="home"><div id="home"></div></section>
    <section class="page" data-page="charges"><div id="charges"></div></section>
    <section class="page" data-page="transactions">
      <div class="searchrow"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="חיפוש"></div><select id="ownerSel" aria-label="בן משפחה"></select></div>
      <div class="chips" id="statusChips">
        <button class="active" data-filter="open">פתוחות</button>
        <button data-filter="charged">חויבו</button>
        <button data-filter="all">הכול</button>
        <button data-filter="manual">ידני</button>
        <button data-filter="uncat">לא מסווג</button>
      </div>
      <div id="chargeFilterBar"></div>
      <div id="txCount" class="countline"></div>
      <div id="transactions"></div>
    </section>
    <section class="page" data-page="budget"><div id="budget"></div></section>
    <section class="page" data-page="savings"><div id="savings"></div></section>
    <section class="page" data-page="accounts"><div id="accounts"></div></section>
    <section class="page" data-page="settings"><div id="settings"></div></section>
  </main>
  <button class="fab" id="fab" aria-label="הוספת עסקה">＋</button>
  <nav>
    <button class="active" data-target="home"><span>⌂</span><small>בית</small></button>
    <button data-target="charges"><span>💳</span><small>חיובים</small></button>
    <button data-target="transactions"><span>☷</span><small>עסקאות</small></button>
    <button data-target="budget"><span>◫</span><small>תקציב</small></button>
    <button data-target="savings"><span>💰</span><small>חיסכון</small></button>
  </nav>
</div>
<div class="overlay" id="overlay"></div>
<aside class="sheet" id="sheet" role="dialog">
  <div class="grab"></div>
  <div class="modalhead"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" aria-label="סגירה">×</button></div>
  <div id="sheetBody"></div>
</aside>
<div class="login" id="login" hidden>
  <div class="loginbox">
    <div class="logo">₪</div>
    <h1>MightyBudget</h1>
    <p>הקלידו את קוד הכניסה</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="קוד כניסה">
    <button class="primary" id="loginBtn">כניסה</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js?v=2.0"></script>
</body>
</html>
